name: astrbot_plugin_ctx_dump
display_name: 上下文时间线
desc: >-
  把每次发给 LLM 的完整上下文（system prompt / contexts / prompt / tools）落盘成
  JSONL，并在插件视图或自带本地页面里查看上下文由什么组成、每一轮怎么变化。
  支持 token 估算分布、逐轮 diff、消息原文展开。
short_desc: 上下文落盘 + 时间线查看
